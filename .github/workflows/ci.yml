name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      # Integration tests (Testcontainers Postgres) land in Phase 5 (booking module).
      # E2E (Playwright + axe-core) and Lighthouse CI land once pages exist to test
      # against — see CHECKLIST.md Phase 8.

      - name: Build
        run: pnpm build
